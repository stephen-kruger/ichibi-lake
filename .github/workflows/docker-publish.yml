# Builds the self-contained image (docker/Dockerfile: gateway plus bundled
# Postgres and Kafka) and publishes it to the GitHub Container Registry as
# ghcr.io/<owner>/ichibi-lake, for linux/amd64 and linux/arm64, so it can be
# run on its own or used with `image:` in a compose file.
#
# Tags:
#   push to main       -> :latest, :main, :sha-<short>
#   push of tag v1.2.3 -> :1.2.3 (the tag without its "v"), :sha-<short>
#   pull request       -> built only (checks the Dockerfile), never pushed
#
# The package is private on first publish; make it public once under the
# repository's Packages -> Package settings -> Change visibility.
name: Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/ichibi-lake

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation (Apple Silicon hosts, Raspberry Pi, Graviton).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags follow package.json's four-part version (v1.6.25.1), which
      # is not semver, so the version tag is the git tag minus its "v".
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=match,pattern=v(.*),group=1
            type=sha
          labels: |
            org.opencontainers.image.title=ichibi-lake
            org.opencontainers.image.description=DuckDB/DuckLake data lake gateway with REST API, GraphQL, Kafka and an admin console

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repo root, as in docker/compose.yaml (the Dockerfile copies src/, public/, ...).
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
