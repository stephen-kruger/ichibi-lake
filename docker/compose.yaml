name: ichibi-lake

services:
  app:
    build:
      # Build from the repo root so the Dockerfile can COPY package.json
      # and src/ directly.
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ichibi-lake
    hostname: ichibi-lake
    # The Node gateway listens on ${PORT:-3000}. This is the only port that is
    # published on every host interface: it serves the REST API, Swagger UI and
    # the admin console. Everything else stays on the Docker networks (or on
    # 127.0.0.1 where a host-side client needs it).
    ports:
      - "${PORT:-3333}:${PORT:-3000}"
    # The gateway needs no Linux capabilities (it listens on an unprivileged
    # port and only writes to directories it owns), and must never gain any.
    cap_drop: [ "ALL" ]
    security_opt: [ "no-new-privileges:true" ]
    environment:
      # DuckLake metadata Postgres (consumed by src/db.js).
      - DUCKLAKE_PG_HOST=db
      - DUCKLAKE_PG_PORT=5432
      - DUCKLAKE_PG_USER=postgres
      # Must equal the db service's password (both read POSTGRES_PASSWORD from
      # docker/.env). See the db service before changing it on an existing lake.
      - DUCKLAKE_PG_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DUCKLAKE_PG_DB=ducklake
      # Where DuckLake writes Parquet data files: a local directory (default,
      # persisted via the bind mount to docker/data/ducklake) or an s3:// URL.
      # For object storage set DUCKLAKE_DATA_PATH=s3://<bucket>/<prefix>/ and
      # the S3_* variables in docker/.env; `COMPOSE_PROFILES=minio` also starts
      # a bundled MinIO server (see the minio service below and README §1.6).
      - DUCKLAKE_DATA_PATH=${DUCKLAKE_DATA_PATH:-/app/data_files}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_SESSION_TOKEN=${S3_SESSION_TOKEN:-}
      - S3_URL_STYLE=${S3_URL_STYLE:-}
      - S3_USE_SSL=${S3_USE_SSL:-}
      # Writes of fewer rows than this are kept in the Postgres catalog until
      # scheduled lake maintenance flushes them to Parquet (0 = every write
      # creates a Parquet file).
      - DATA_INLINING_ROW_LIMIT=${DATA_INLINING_ROW_LIMIT:-1000}
      # Allow the DuckPGQ community extension (SQL/PGQ graph queries).
      - DUCKDB_ALLOW_COMMUNITY_EXTENSIONS=1
      # Lake maintenance (flush inlined rows, merge small files, rewrite files
      # with deletes, expire snapshots, delete unreferenced files) runs at
      # startup and on the schedule set in the admin console (Retention &
      # Pruning page). Set DISABLE_DUCKLAKE_COMPACTION=1 here as an emergency
      # escape hatch to stop every maintenance run (see package.json's
      # "_comments" entry for the DuckLake issues maintenance works around).
      # - DISABLE_DUCKLAKE_COMPACTION=1
      # Store BLOBs as separate files on the local filesystem instead of inline
      # in Parquet. Only filesystem paths are stored in DuckLake tables. BLOB
      # files always stay on this local (or mounted) directory, also when the
      # lake itself is on object storage.
      - USE_FILESYSTEM_BLOBS=1
      # Directory where BLOB files are written. Persisted via the bind mount
      # to docker/data/blobs so files survive container restarts.
      - BLOBS_PATH=/app/blobs
      # Gateway API key(s). Comma-separate multiple keys. The default matches
      # the test key baked into swagger.yaml / test-graphs.js.
      - API_KEYS=${API_KEYS:-ICHIBI_LAKE_TEST_7a96c3e2-b1fe-4705-9064-fc1882674b13}
      # RBAC configuration (overrides API_KEYS when set)
      - RBAC_SUPERUSERS=${RBAC_SUPERUSERS:-}
      - RBAC_USERS=${RBAC_USERS:-}
      - RBAC_TABLE_PERMISSIONS=${RBAC_TABLE_PERMISSIONS:-}
      # Kafka broker(s) for the SSE subscription endpoint and internal consumer.
      # Comma-separated list. Leave empty if not using Kafka.
      - KAFKA_BROKERS=${KAFKA_BROKERS:-}
      # Port the Node gateway listens on.
      - PORT=${PORT:-3000}
      # Admin console (/console). On first start with no console logins, a
      # one-time setup code is printed to the log; set CONSOLE_SETUP_TOKEN to
      # choose it yourself. CONSOLE_SESSION_SECRET optionally pins the session
      # signing key (otherwise one is generated and stored in DuckLake).
      - CONSOLE_SETUP_TOKEN=${CONSOLE_SETUP_TOKEN:-}
      - CONSOLE_SESSION_SECRET=${CONSOLE_SESSION_SECRET:-}
      # Externally reachable base URL, used in log messages (e.g. the admin
      # console link). Defaults to the host port published above; set it to
      # your real address (e.g. https://lake.example.com) when deployed.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:${PORT:-3333}}
      # Bulk import (POST /tables/:tableName/import): largest upload in MB,
      # s3:// prefixes any writer may import from (comma-separated; other
      # s3:// sources need a superuser key), and how long Idempotency-Key
      # results are kept.
      - IMPORT_MAX_MB=${IMPORT_MAX_MB:-1024}
      - IMPORT_ALLOWED_SOURCES=${IMPORT_ALLOWED_SOURCES:-}
      - IDEMPOTENCY_TTL_HOURS=${IDEMPOTENCY_TTL_HOURS:-24}
      # Bearer token for GET /metrics (Prometheus). When empty, /metrics
      # requires a superuser API key instead.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    volumes:
      # Persist DuckLake Parquet data files across container rebuilds.
      - ./data/ducklake:/app/data_files
      # Persist BLOB files across container rebuilds when USE_FILESYSTEM_BLOBS=1.
      - ./data/blobs:/app/blobs
    extra_hosts:
      # Allows the container to reach the Docker host for Kafka brokers etc.
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
      - db-network
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Only with the minio profile: wait until the bucket exists.
      minio-init:
        condition: service_completed_successfully
        required: false
    # Liveness only (GET /health, no auth, no database access). Use
    # GET /health/ready to check DuckLake + Postgres from a load balancer.
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:${PORT:-3000}/health > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-shot init that fixes ownership and permissions on the bind-mounted
  # Postgres data dir before the db service starts. The postgres:17 image runs
  # the server as its internal postgres user (uid 999) and refuses to start
  # unless PGDATA is owned by that user AND has 0700/0750 permissions
  # ("FATAL: data directory ... has invalid permissions"). On host bind mounts
  # those bits can drift across `docker compose down`/`up` cycles, which is
  # what breaks the db service on restart. Runs as root, normalises ownership
  # to 999:999 and the top-level dir to 0700, then exits. This keeps restarts
  # deterministic without hard-coding host UIDs into the db service itself.
  postgres-init:
    image: postgres:17
    container_name: ichibi-lake-postgres-init
    user: "0:0"
    # Touches only its bind mount: no network at all.
    network_mode: none
    entrypoint:
      - sh
      - -c
      - mkdir -p /var/lib/postgresql/data && chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: "no"

  db:
    container_name: ichibi-lake-postgres
    image: postgres:17
    # No published port: only the gateway talks to Postgres, over db-network,
    # an internal network that nothing else joins and that has no route out.
    # For ad-hoc access use `docker compose exec db psql -U postgres ducklake`.
    environment:
      - POSTGRES_USER=postgres
      # Set POSTGRES_PASSWORD in docker/.env. Postgres only applies it when it
      # initialises an EMPTY data directory: on an existing lake, first run
      #   docker compose exec db psql -U postgres -c "ALTER USER postgres PASSWORD '<new>'"
      # then set POSTGRES_PASSWORD=<new> and `docker compose up -d`.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=ducklake
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    # The postgres-init one-shot above normalises PGDATA ownership (uid 999)
    # and permissions (0700) on every `up`, so the server starts cleanly across
    # restarts without an explicit user: set and without UID/GID conflicts on
    # either macOS or Linux.
    #
    # Logging tuned so Postgres does not write huge log files:
    # - log_statement=none            → do not log every query (blobs are huge)
    # - log_min_duration_statement=2000 → only log queries slower than 2 s
    # - logging_collector=on           → write logs to files inside PGDATA
    # - log_filename=postgresql-%a.log → rotate by day-of-week name
    # - log_truncate_on_rotation=on   → overwrite the same day-of-week file,
    #                                     giving ~7 days retention with no
    #                                     external cleanup needed.
    command: >
      postgres
      -c log_statement=none
      -c log_min_messages=warning
      -c log_min_duration_statement=2000
      -c log_checkpoints=on
      -c log_connections=off
      -c log_disconnections=off
      -c logging_collector=on
      -c log_directory=log
      -c log_filename=postgresql-%a.log
      -c log_rotation_age=1d
      -c log_truncate_on_rotation=on
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - db-network
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # One-shot init that fixes ownership on the bind-mounted Kafka log dir.
  # The apache/kafka:4.3.1 image runs as uid 1000 (appuser); a fresh host
  # bind-mount directory is owned by root, which prevents the broker from
  # writing meta.properties on first start. Runs as root, chowns, exits.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: ichibi-lake-kafka-init
    user: "0:0"
    # Touches only its bind mount: no network at all.
    network_mode: none
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    container_name: ichibi-lake-kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    # No published ports: the broker has no authentication, and only the
    # gateway uses it (kafka:9092 on app-network). Clients outside Docker send
    # messages through the gateway's POST /kafka-sink instead.
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Allow larger produce requests / records so SSE DuckDB dumps with
      # base64-encoded BLOB columns are not rejected with MESSAGE_TOO_LARGE.
      # Must stay in sync with the producer-side KAFKA_MAX_REQUEST_SIZE in the
      # app service environment.
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      # Persist KRaft logs under a bind-mounted directory instead of the
      # image default (/tmp/kraft-combined-logs) so retention behaviour is
      # observable on the host and survives container rebuilds.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Retention: cap how long and how big partition logs grow before the
      # delete-policy cleaner removes old segments. Overridable via .env.
      # Note: a segment must roll (KAFKA_LOG_SEGMENT_BYTES) before it is
      # eligible for deletion, so segment size is kept well below retention.
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-48}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-268435456}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-60000}
      CLUSTER_ID: ichibi-lake-cluster
    volumes:
      # Persist Kafka KRaft logs across container rebuilds.
      - ./data/kafka:/var/lib/kafka/data
    networks:
      - app-network
    security_opt: [ "no-new-privileges:true" ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Optional S3-compatible object storage for the lake (COMPOSE_PROFILES=minio).
  # The minio/minio images are no longer published on Docker Hub or quay.io;
  # Chainguard's build is used instead (override with MINIO_IMAGE). Point the
  # gateway at it in docker/.env:
  #   DUCKLAKE_DATA_PATH=s3://ichibi-lake/lake/
  #   S3_ENDPOINT=minio:9000
  #   S3_ACCESS_KEY=<MINIO_ROOT_USER>   S3_SECRET_KEY=<MINIO_ROOT_PASSWORD>
  #   S3_USE_SSL=false
  minio:
    profiles: [ "minio" ]
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    container_name: ichibi-lake-minio
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-ichibi-lake}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
    # The gateway reaches MinIO as minio:9000 on the Docker network. The host
    # ports (S3 API and web console) are bound to 127.0.0.1 so only this
    # machine can use them; set MINIO_BIND_ADDRESS=0.0.0.0 to share them.
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - app-network
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped

  # One-shot: wait for MinIO and create the bucket (idempotent). Uses curl's
  # built-in SigV4 signing, so no MinIO client image is needed.
  minio-init:
    profiles: [ "minio" ]
    image: curlimages/curl:8.11.1
    container_name: ichibi-lake-minio-init
    depends_on:
      - minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-ichibi-lake}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change-me-minio-secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-ichibi-lake}
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 1 60); do curl -sf http://minio:9000/minio/health/live > /dev/null && break; sleep 1; done
        code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3' --user "$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD" -X PUT "http://minio:9000/$$MINIO_BUCKET")
        echo "create bucket $$MINIO_BUCKET: HTTP $$code"
        [ "$$code" = 200 ] || [ "$$code" = 409 ]
    networks:
      - app-network
    restart: "no"

networks:
  app-network:
    driver: bridge
  # Postgres only. internal: no published ports work on it and containers on
  # it have no route out, so the catalog is reachable from the gateway alone.
  db-network:
    driver: bridge
    internal: true
