# Logging for the Kafka broker bundled in the image (docker/entrypoint.sh):
# warnings and errors only, to stdout, so they show in the container log.
status = warn
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [kafka] %p %c{1} - %m%n
rootLogger.level = WARN
rootLogger.appenderRef.stdout.ref = STDOUT
